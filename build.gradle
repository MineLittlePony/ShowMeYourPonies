buildscript {
    dependencies {
        classpath 'com.github.dexman545:Outlet:1.6.1'
    }
}
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
    id 'org.ajoberstar.reckon' version '0.13.1'
}
apply plugin: 'io.github.dexman545.outlet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

group = project.group
description = project.displayname

base {
    archivesName = project.name
}

reckon {
    scopeFromProp()
    stageFromProp('beta', 'rc', 'final')
}

outlet {
    allowSnapshotsForProject = 'true'.equals(project.minecraft_version_allow_snapshot)
    mcVersionRange = project.minecraft_version_range
}

System.out.println "Outlet MC Versions: ${outlet.mcVersions()}"

repositories {
    mavenLocal()
    flatDir { dirs 'lib' }
    maven { name 'modmenu'; url 'https://maven.terraformersmc.com/releases' }
    maven { name 'minelp'; url 'https://repo.minelittlepony-mod.com/maven/snapshot' }
    maven { name 'minelp-release'; url 'https://repo.minelittlepony-mod.com/maven/release' }
    maven { name 'smys-release'; url 'https://maven.enjarai.dev/releases' }
    maven { name 'smys-mirror'; url 'https://maven.enjarai.dev/mirrors' }
    maven { name 'Ladysnake Mods'; url 'https://maven.ladysnake.org/releases' }
    maven { name 'Modrinth'; url 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    api "net.fabricmc:fabric-loader:${project.loader_version}"

    api "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    api "com.minelittlepony:minelittlepony:${project.minelp_version}"
    api "maven.modrinth:show-me-your-skin:${project.smys_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // show me your skins dependencies
    implementation("nl.enjarai:cicada-lib:${project.cicada_version}") { exclude group: "net.fabricmc.fabric-api" }
    implementation "io.wispforest:owo-lib:${project.owo_version}"
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
}

processResources {
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": ">=${project.minecraft_version}",
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}",
                "smysVersion": ">=${project.smys_version}",
                "minelpVersion": ">=${project.minelp_version}"
    }

    from 'LICENSE'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

tasks.modrinth {
    onlyIf {
      def stage = version.version.stage.value
      stage == null || stage.name != 'beta'
    }
}

modrinth {
    token = System.env.MODRINTH_KEY
    projectId = project.modrinth_project_id
    //featured = true
    versionNumber = version.toString()
    versionName = project.name + '-' + version
    changelog = "[Changelog](https://github.com/MineLittlePony/MineLittlePony/releases/tag/${version.toString()})"
    loaders = ['fabric', 'quilt']
    uploadFile = jar
    outlet.mcVersions().each{ver ->
      gameVersions.add ver
    }
    dependencies {
       required.project 'P7dR8mSH' // Fabric API
       required.project 'JBjInUXM' // Mine Little Pony
       required.project 'bD7YqcA3' // Show Me Your Skin
    }
}
